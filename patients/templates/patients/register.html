```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | CarePlus</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f5f9;
            color: #243447;
            min-height: 100vh;
            padding: 35px 16px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            display: inline-block;
            background: #d9f5ed;
            color: #087f68;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 9px;
        }

        .header p {
            color: #68788a;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(35, 65, 85, 0.08);
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #788696;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d8e1e9;
            border-radius: 9px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        textarea {
            min-height: 95px;
            resize: vertical;
        }

        .hint {
            font-size: 12px;
            color: #8190a0;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 26px;
        }

        button, .back {
            border: none;
            border-radius: 9px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
        }

        button {
            flex: 1;
            background: #087f8c;
            color: white;
        }

        button:hover {
            background: #066875;
        }

        .back {
            background: #edf2f7;
            color: #34465a;
        }

        .footer {
            text-align: center;
            color: #8794a3;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 22px 17px;
            }

            .header h1 {
                font-size: 25px;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header class="header">
            <div class="logo">CarePlus+</div>
            <h1>Patient Registration</h1>
            <p>Patient Case-Taking Software</p>
        </header>

        <main class="card">
            <h2>Patient Information</h2>
            <p class="subtitle">
                Please enter the patient's details below.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="form-grid">

                    <div class="field full">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name"
                               placeholder="Enter patient's full name"
                               maxlength="100" required>
                    </div>

                    <div class="field">
                        <label for="age">Age *</label>
                        <input type="number" id="age" name="age"
                               placeholder="Enter age" min="0"
                               max="120" required>
                    </div>

                    <div class="field">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="mobile">Mobile Number *</label>
                        <input type="tel" id="mobile" name="mobile"
                               placeholder="Enter 10-digit mobile number"
                               pattern="[0-9]{10}" maxlength="10" required>
                        <span class="hint">Enter a 10-digit number.</span>
                    </div>

                    <div class="field full">
                       <label for="chief_complaint">Symptoms / Chief Complaint *</label>
<textarea id="chief_complaint"
          name="chief_complaint"
          placeholder="Describe the patient's symptoms"
          required></textarea>



                    </div>

                    <div class="field full">
                        <label for="history">Medical History</label>
                        <textarea id="history" name="medical_history"
                                  placeholder="Previous illnesses, allergies, medicines, etc."></textarea>
                    </div>

                </div>

                <div class="actions">
                    <a href="/" class="back">Cancel</a>
                    <button type="submit">Register Patient →</button>
                </div>
            </form>
        </main>

        <footer class="footer">
            Patient Case-Taking Software · Keep patient information confidential.
        </footer>

    </div>
</body>
</html>
```
