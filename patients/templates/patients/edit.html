
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #263247;
            padding: 30px 16px;
        }

        .container {
            max-width: 720px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h1 {
            color: #173b67;
            font-size: 27px;
        }

        .back-btn {
            text-decoration: none;
            color: #173b67;
            font-size: 14px;
            font-weight: bold;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 22px rgba(20, 50, 90, 0.07);
            border: 1px solid #e7edf5;
        }

        .subtitle {
            color: #778398;
            margin: 10px 0 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9e1ec;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: #fff;
            color: #263247;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3478c7;
            box-shadow: 0 0 0 3px #3478c71a;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .update-btn {
            width: 100%;
            padding: 14px;
            background: #173b67;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .update-btn:hover {
            background: #24558d;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #65748b;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-card {
                padding: 22px 18px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <h1>Edit Patient</h1>
            <a href="{% url 'patient_detail' patient.id %}"
               class="back-btn">
                ← Back to Profile
            </a>
        </div>

        <div class="form-card">
            <h2>Update Patient Information</h2>
            <p class="subtitle">
                Edit the information below and save your changes.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Patient Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ patient.name }}"
                        required
                    >
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input
                            type="number"
                            id="age"
                            name="age"
                            value="{{ patient.age }}"
                            min="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="Male"
                                {% if patient.gender == "Male" %}selected{% endif %}>
                                Male
                            </option>
                            <option value="Female"
                                {% if patient.gender == "Female" %}selected{% endif %}>
                                Female
                            </option>
                            <option value="Other"
                                {% if patient.gender == "Other" %}selected{% endif %}>
                                Other
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        value="{{ patient.mobile }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="chief_complaint">Chief Complaint</label>
                    <textarea
                        id="chief_complaint"
                        name="chief_complaint"
                    >{{ patient.chief_complaint }}</textarea>

<div class="form-group">
    <label for="medical_history">Medical History</label>
    <textarea
        id="medical_history"
        name="medical_history"
    >{{ patient.medical_history }}</textarea>
</div>


                </div>

                <button type="submit" class="update-btn">
                    Update Patient
                </button>

                <a href="{% url 'patient_detail' patient.id %}"
                   class="cancel">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</body>
</html>
