<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Patient</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 450px;
            width: 100%;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h2 {
            color: #263247;
            margin-bottom: 12px;
        }

        p {
            color: #718096;
            line-height: 1.6;
            font-size: 14px;
        }

        .patient-name {
            color: #173b67;
            font-weight: bold;
            font-size: 17px;
            margin: 20px 0;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancel {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            font-weight: bold;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .cancel {
            background: #e9eef5;
            color: #263247;
        }

        .delete-btn:hover {
            background: #b52a37;
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="icon">🗑️</div>

        <h2>Delete Patient?</h2>

        <p>
            Are you sure you want to delete this patient record?
            This action cannot be undone.
        </p>

        <div class="patient-name">
            {{ patient.name }}
        </div>

        <div class="buttons">

            <a href="{% url 'patient_detail' patient.id %}"
               class="cancel">
                Cancel
            </a>

            <form method="POST" style="flex: 1; display: flex;">
                {% csrf_token %}

                <button type="submit" class="delete-btn">
                    Yes, Delete
                </button>
            </form>

        </div>

    </div>
</body>
</html>
